services:
  spartenet-manager:
    build:
      context: ./SparteNet_Manager
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      SPARTENET_HOST: "0.0.0.0"
      SPARTENET_PORT: "8765"
      SPARTENET_DATA_DIR: "/data"
      SPARTENET_KEIN_BROWSER: "1"
      SPARTENET_PASSWORD_FILE: /run/secrets/spartenet_password
      # MariaDB/MySQL – Werte in .env (siehe .env.example); ohne SPARTENET_DB_HOST speichert der Manager in /data
      SPARTENET_DB_HOST: ${SPARTENET_DB_HOST:-}
      SPARTENET_DB_PORT: ${SPARTENET_DB_PORT:-3306}
      SPARTENET_DB_NAME: ${SPARTENET_DB_NAME:-spartenet}
      SPARTENET_DB_USER: ${SPARTENET_DB_USER:-spartenet}
      SPARTENET_DB_SSL: ${SPARTENET_DB_SSL:-0}
      SPARTENET_DB_PASSWORD_FILE: /run/secrets/spartenet_db_password
      # hinter einem Reverse-Proxy (nginx, Traefik, Caddy): echte Absenderadresse für Anmeldesperre und Protokoll
      SPARTENET_PROXY: ${SPARTENET_PROXY:-0}
      # tägliche Datensicherung nach /data/datensicherungen (0 = aus); Passwort optional als Secret, dann verschlüsselt
      SPARTENET_SICHERUNG: ${SPARTENET_SICHERUNG:-1}
      # SPARTENET_SICHERUNG_PASSWORT_FILE: /run/secrets/spartenet_sicherung_password
      # E-Mail-Versand der Automationen: Passwort lieber als Secret statt in der Oberfläche
      # SPARTENET_SMTP_PASSWORD_FILE: /run/secrets/spartenet_smtp_password
      # API-Schnittstelle: Anfragen je Minute und Schlüssel
      SPARTENET_API_PRO_MINUTE: ${SPARTENET_API_PRO_MINUTE:-120}
    # MariaDB direkt auf dem Docker-Host: SPARTENET_DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - spartenet-daten:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - spartenet_password
      - spartenet_db_password
      # - spartenet_smtp_password
      # - spartenet_sicherung_password

secrets:
  spartenet_password:
    file: ./secrets/spartenet_password.txt
  spartenet_db_password:
    file: ./secrets/spartenet_db_password.txt
  # spartenet_smtp_password:
  #   file: ./secrets/spartenet_smtp_password.txt
  # spartenet_sicherung_password:
  #   file: ./secrets/spartenet_sicherung_password.txt

volumes:
  spartenet-daten: